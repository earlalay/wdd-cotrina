<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cotrina's Video Game Recommendations</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img id="logo" src="images/CotrinaLogo_128x128.png" alt="Gaming Logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="mobile_games.html">Mobile Games</a>
            <a href="pc_games.html">PC Games</a>
        </nav>
    </header>
    <main>
        <h1 id="welcome-line">Welcome to my Videogame Recommendation Hub</h1>
        <hr id="first-divider">
        <p id="home-page-hook">Here you will find curated lists, positive reviews, and 
            clear explanations of what makes each game special.
        </p>
        <hr id="second-divider">
        <h2>What Makes a Game Great</h2>
        <section id="good-game-attr">
            <div>
                <img src="images/Story1.PNG" alt="Text bubbles">
                <p class="home-page-labels">Engaging Story</p>
            </div>
            <div>
                <img src="images/Gameplay.png" alt="Game controller">
                <p class="home-page-labels">Creative Gameplay</p>
            </div>
            <div>
                <img src="images/Art.png" alt="Palette and notes">
                <p class="home-page-labels">Beautiful Art & Music</p>
            </div>
            <div>
                <img src="images/Progression1.PNG" alt="Stats">
                <p class="home-page-labels">Meaningful Progression</p>
            </div>
            <div>
                <img src="images/Factor1.PNG" alt="Star">
                <p class="home-page-labels">Fun Factor</p>
            </div>
        </section>
    </main>
</body>
